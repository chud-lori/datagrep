name: Linux packages

# Packages the Linux Qt UI into .deb, .rpm and AppImage artifacts.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/linux-package.yml"
  workflow_dispatch:

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: package (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            qt6-gtk-platformtheme qt6-xdgdesktopportal-platformtheme \
            libgl1-mesa-dev \
            zlib1g-dev \
            libdbus-1-dev \
            ruby ruby-dev rpm \
            desktop-file-utils
          sudo apt-get install -y qt6-svg-dev || \
            sudo apt-get install -y libqt6svg6-dev

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build FFI static library
        run: cargo build -p datagrep-ffi --release

      - name: Configure UI (CMake)
        run: >
          cmake -S ui/linux -B ui/linux/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDATAGREP_BUILD_RUST=OFF

      - name: Build UI
        run: cmake --build ui/linux/build

      - name: Validate desktop entry
        run: desktop-file-validate packaging/datagrep.desktop

      - name: Build .deb and .rpm
        run: bash packaging/build-packages.sh

      - name: Build AppImage
        run: bash packaging/build-appimage.sh

      - name: Inspect packages
        run: |
          set -x
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -qpi dist/*.rpm
          rpm -qp --requires dist/*.rpm
          ls -l dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datagrep-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
