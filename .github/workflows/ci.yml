name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates.sh (linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust (stable, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            xtask

      - name: Install supply-chain tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Cache RustSec advisory database
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/advisory-db
            ~/.cargo/advisory-dbs
          key: advisory-db-${{ github.run_id }}
          restore-keys: |
            advisory-db-

      - name: Shellcheck shell entry points
        run: shellcheck ci/gates.sh install.sh

      - name: Run Tier-1 gates
        run: ./ci/gates.sh

  macos-app:
    name: swift build (macos-14)
    # macos-14 ships Swift 5.10; Package.swift needs tools 6.1, which is on macos-15.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: ui/macos/.build
          key: swiftpm-macos14-${{ hashFiles('ui/macos/Package.swift') }}
          restore-keys: |
            swiftpm-macos14-

      - name: Build app (stub FFI)
        run: cd ui/macos && swift build -c release
