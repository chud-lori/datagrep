name: CI

# The Tier-1 gate: every PR, hardware-independent,
# deterministic, <8 min. Runs ci/gates.sh verbatim — the same script
# contributors run locally, so "green in CI" and "green locally" mean
# the same thing. gates.sh covers cargo fmt --check, the supply-chain scan
# (cargo-audit + cargo-deny), clippy -D warnings, cargo test --workspace,
# the anti-pattern greps, and the budget.toml size/crate-count checks.
#
# Runner policy (learned the hard way on chud-lori/tangi): never macos-13.
# The free-tier Intel macOS pool is starved (10+ min queue while everything
# else finished in seconds) and is on GitHub's deprecation path. All macOS
# work runs on macos-14 (Apple silicon); release.yml cross-compiles x86_64
# from there via rustup targets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, for the supply-chain gate specifically. Every other check here is a
  # function of the tree and cannot change while the tree does not — but a new
  # RUSTSEC advisory lands against a Cargo.lock nobody touched, and on a repo
  # with a slow week that is precisely the window where a known-vulnerable
  # dependency sits in main unnoticed. Monday morning, before anyone starts.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates.sh (linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # keyring's Secret Service backend links libdbus. Without this the
      # workspace does not build on a bare Ubuntu runner at all — the same
      # dependency a Linux package will have to declare.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust (stable, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Two Cargo workspaces in this repo: the root workspace (crates/*)
      # and xtask/ (opts out via its own [workspace] table — see
      # xtask/Cargo.toml — so its lockfile/target need caching separately).
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            xtask

      # Prebuilt binaries, not `cargo install`. Building cargo-audit and
      # cargo-deny from source is ~4 minutes of the 8-minute Tier-1 budget for
      # two tools that then spend 5 seconds each reading Cargo.lock;
      # install-action pulls the release binaries in a couple of seconds. This
      # step is also what makes gates.sh's supply-chain section a real gate:
      # the script hard-fails when either tool is missing and CI is set, so
      # deleting this step breaks the build rather than quietly disarming it.
      - name: Install supply-chain tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # The RustSec advisory database is a git clone that both tools share, and
      # a cold clone costs more than the scans themselves. Key on run_id so the
      # cache is rewritten every run and restore-keys picks up the most recent
      # one; both tools `git pull` it on startup anyway, so a restored copy is
      # refreshed rather than stale — the cache saves the clone, not the update.
      - name: Cache RustSec advisory database
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ github.run_id }}
          restore-keys: |
            advisory-db-

      - name: Shellcheck shell entry points
        run: shellcheck ci/gates.sh install.sh

      - name: Run Tier-1 gates
        run: ./ci/gates.sh

  # Builds the macOS app with the default stub FFI (synthetic data, no cargo
  # involved) purely to catch Swift-side breakage on every push while staying
  # fast. The real-FFI link (libdatagrep_ffi.a) is exercised by release.yml.
  macos-app:
    name: swift build (macos-14)
    # macos-14 ships Swift 5.10; Package.swift needs tools 6.1, which is on macos-15.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: ui/macos/.build
          key: swiftpm-macos14-${{ hashFiles('ui/macos/Package.swift') }}
          restore-keys: |
            swiftpm-macos14-

      - name: Build app (stub FFI)
        run: cd ui/macos && swift build -c release
