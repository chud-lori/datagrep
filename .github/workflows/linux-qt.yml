name: Linux Qt UI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ui/linux/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/linux-qt.yml"
  pull_request:
    paths:
      - "ui/linux/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/linux-qt.yml"
  workflow_dispatch:

concurrency:
  group: linux-qt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: cmake build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            libgl1-mesa-dev \
            zlib1g-dev \
            libdbus-1-dev
          sudo apt-get install -y qt6-svg-dev || \
            sudo apt-get install -y libqt6svg6-dev
          sudo apt-get install -y libkf6syntaxhighlighting-dev || \
            echo "KF6SyntaxHighlighting unavailable — building the fallback highlighter"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build FFI static library
        run: cargo build -p datagrep-ffi --release

      - name: Configure UI (CMake)
        run: >
          cmake -S ui/linux -B ui/linux/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDATAGREP_BUILD_RUST=OFF

      - name: Build UI
        run: cmake --build ui/linux/build

  build-kf6:
    name: cmake build (debian, KF6 highlighter)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: System dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates curl git \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            qt6-svg-dev \
            libgl1-mesa-dev \
            zlib1g-dev \
            libdbus-1-dev \
            libkf6syntaxhighlighting-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build FFI static library
        run: cargo build -p datagrep-ffi --release

      - name: Configure UI (CMake)
        run: >
          cmake -S ui/linux -B ui/linux/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDATAGREP_BUILD_RUST=OFF
          -DDATAGREP_REQUIRE_KSYNTAXHIGHLIGHTING=ON

      - name: Build UI
        run: cmake --build ui/linux/build
