# xtask — CI/dev task runner for datagrep (budget checks, benchmark fixtures,
# and the grep gates run by ci/gates.sh).
#
# Standalone on purpose: the empty [workspace] table below opts this crate OUT of
# the root workspace, so the root Cargo.toml's `crates/*` glob is never touched
# and other agents/crates build independently of this one.
#
# Dependency policy: ZERO dependencies. budget.toml is a deliberately tiny TOML
# subset (tables + quoted-string keys) parsed by hand in src/main.rs, with tests.
# This keeps `ci/gates.sh` able to build xtask offline on any runner.

[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

[workspace]
