# Flatpak manifest for the GTK4/libadwaita UI (issue #36). The Qt UI keeps its
# AppImage/.deb/.rpm route; this is an additional route, not a replacement.
#
# Runtime 50, not the Ubuntu 22.04 floor and not the 47/48 the design report
# named: the window composition needs libadwaita >= 1.7 (AdwToolbarView 1.4,
# AdwToggleGroup/AdwInlineViewSwitcher 1.7), and GNOME runtimes are EOL once
# two newer releases exist — 47 died Sep 2025, 48 died Mar 2026, 49 dies when
# 51 ships (~Sep 2026). 50 (libadwaita 1.9, GTK 4.20) is the oldest branch
# that outlives this app's parity timeline; bumping later is a one-line change.
#
# cargo-sources.json is GENERATED by generate-cargo-sources.sh, never
# committed: flatpak-builder cuts the network before build-commands run, and
# that file lets it pre-download every crate so `cargo --offline` resolves.
# It merges BOTH lockfiles — the workspace's and ui/gtk4's, which is its own
# cargo workspace. Regenerated every CI run, so it cannot go stale.
app-id: io.github.chud_lori.datagrep
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# Rust comes from the SDK extension (branch auto-matched to the SDK's 25.08
# base), not from rustup: rustup cannot run in the offline sandbox.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
# The GTK4 app. The CLI is installed alongside it and stays reachable with
# `flatpak run --command=datagrep-cli io.github.chud_lori.datagrep`.
command: datagrep

finish-args:
  - --socket=wayland
  # Taken only when no Wayland compositor answers.
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Database servers, SSH tunnels, the update check.
  - --share=network
  # datagrep-tunnel agent auth: maps the host ssh-agent socket in.
  - --socket=ssh-auth
  # SQLite databases live anywhere under home, and a file-chooser portal
  # grant covers the picked file only — never the -wal/-shm siblings SQLite
  # creates beside it — so the portal alone cannot open a database.
  - --filesystem=home
  # datagrep-secrets (keyring crate, sync-secret-service backend) speaks
  # org.freedesktop.secrets on the session bus. This reaches the SAME host
  # keyring the CLI and Qt builds use, so saved credentials keep resolving.
  # The Secret portal is NOT a substitute: it only vends a per-app master key
  # for a self-managed encrypted store, which the keyring crate does not
  # implement — portal-only would strand every existing credential.
  - --talk-name=org.freedesktop.secrets

modules:
  - name: datagrep
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/datagrep/cargo
    build-commands:
      # The CLI first, from the root workspace; the GTK4 UI is a second
      # workspace and links datagrep-ffi (the full driver graph) as a crate.
      - cargo --offline build --release -p datagrep-cli
      - install -Dm755 target/release/datagrep /app/bin/datagrep-cli
      - cargo --offline build --release --manifest-path ui/gtk4/Cargo.toml
      # /app/bin/datagrep is what `command:` and the .desktop Exec both name.
      - install -Dm755 ui/gtk4/target/release/datagrep-gtk /app/bin/datagrep
      - install -Dm644 packaging/flatpak/io.github.chud_lori.datagrep.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/io.github.chud_lori.datagrep.metainfo.xml -t /app/share/metainfo
      - install -Dm644 packaging/icons/datagrep.svg /app/share/icons/hicolor/scalable/apps/io.github.chud_lori.datagrep.svg
      - install -Dm644 packaging/icons/datagrep.png /app/share/icons/hicolor/256x256/apps/io.github.chud_lori.datagrep.png
      # When the app grows a GSettings schema (the piece AppImage could never
      # carry cleanly — here it is two lines):
      #   install -Dm644 ui/gtk4/data/io.github.chud_lori.datagrep.gschema.xml -t /app/share/glib-2.0/schemas
      #   glib-compile-schemas /app/share/glib-2.0/schemas
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - target
          - dist
          - xtask/target
          - ui/gtk4/target
          - ui/macos/.build
      - cargo-sources.json
