[package]
name = "datagrep-drv-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SQLite driver for datagrep: a dedicated worker thread per connection bridges rusqlite's sync API to the async datagrep-api seam."

[dependencies]
datagrep-api = { path = "../datagrep-api" }

# rusqlite is a synchronous API; the whole cursor lives on a per-connection
# worker thread — never block_on inside an async task.
# `column_decltype` gives us `Statement::columns()[i].decl_type()`, which
# `value.rs`/`scan.rs` use for the BOOLEAN/DATE/TIME affinity mapping.
# `hooks` gives us `progress_handler`, used only in `canceller.rs`/`error.rs`
# tests to synchronize a genuine concurrent interrupt of a running step.
rusqlite = { version = "0.37", features = ["bundled", "column_decltype", "hooks"] }

# rt + sync only: oneshot replies from the worker thread. The worker itself is
# a plain std::thread, not spawn_blocking.
tokio = { version = "1", features = ["rt", "sync"] }

thiserror = { workspace = true }
tracing = "0.1"

# Required to implement datagrep-api's #[async_trait] traits (datagrep-api does not
# re-export the macro) and to build Value::Bytes from BLOB columns.
async-trait = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Tests parse the catalog's hand-emitted index/default JSON to pin its shape.
# Dev-only on purpose — the driver itself never depends on serde_json.
serde_json = { workspace = true }
