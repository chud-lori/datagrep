[package]
name = "datagrep-tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process SSH tunnels for datagrep: agent/key/password auth, TOFU host-key pinning, direct-tcpip channels bridged to in-process duplex streams (design §3.5, §3.8)."

[dependencies]
datagrep-api = { path = "../datagrep-api" }
# Pinned against 0.62.5 (crates.io max_stable_version as of 2026-08, verified
# via the crates.io API). Deliberately NOT depending on the separate
# `russh-keys` crate named in the original brief: as of this version the
# russh workspace no longer publishes it (github.com/warp-tech/russh workspace
# members are `russh`, `russh-config`, `cryptovec`, `pageant`, `russh-util` —
# no `russh-keys`). Key/agent handling now lives in `russh::keys` inside the
# main crate; the last `russh-keys` release on crates.io (0.49.2) predates
# that merge and pulls in a *different* `ssh-key` version, which would give
# us two incompatible `PublicKey`/`PrivateKey` types. See crate root docs.
#
# `default-features = false` + `ring` instead of the crate default
# `aws-lc-rs`: aws-lc-sys needs `cmake` to build from source, which this
# toolchain doesn't have (verified by probing both feature sets in an
# isolated scratch crate); `ring` is a pure-Rust-plus-precompiled-asm crypto
# backend with no such build dependency and no behavior difference relevant
# to us. `rsa`/`flate2` kept to match upstream's default feature set minus
# the swapped backend.
russh = { version = "=0.62.5", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }
thiserror = { workspace = true }
tracing = "0.1"
dirs = "6"

[dependencies.tokio]
version = "1"
features = ["net", "sync", "time", "io-util", "rt", "fs"]

[dev-dependencies]
# No tempfile crate: tests build unique paths under `std::env::temp_dir()`
# by hand (design brief pins the dependency list; this keeps us inside it).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
