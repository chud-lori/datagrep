[package]
name = "dbx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "dbx query -f q.sql --format json | jq — the first runnable face of dbx: `CoreApi` over a terminal (design §4 killer feature #4, §9 tier-3 extension surface)."

[[bin]]
name = "dbx"
path = "src/main.rs"

[dependencies]
dbx-api = { path = "../dbx-api" }
dbx-core = { path = "../dbx-core" }
dbx-lang = { path = "../dbx-lang" }
dbx-profiles = { path = "../dbx-profiles" }
dbx-secrets = { path = "../dbx-secrets" }
dbx-drv-postgres = { path = "../dbx-drv-postgres" }
dbx-drv-sqlite = { path = "../dbx-drv-sqlite" }

clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "sync",
    "fs",
    "io-std",
] }

# CoreApi hands tabular results back as Arrow `RecordBatch`es (dbx-core's
# `WindowSlice::Table`); this crate has to read those cells to print them.
# Pinned to the same version dbx-core uses so the `RecordBatch`/`ArrayRef`
# types are the exact same crate, not two incompatible major versions.
# Deviation from the ticket's dependency list, called out in the final
# report: not arrow-csv/arrow-json (this crate's NULL/Absent/empty-string
# distinction and streaming windows need custom formatting those crates
# don't provide), just the array/schema types already flowing through the
# seam.
arrow-array = "59.1"
arrow-schema = "59.1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
uninlined_format_args = "allow"
