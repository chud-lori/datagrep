[package]
name = "datagrep-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "datagrep query -f q.sql --format json | jq — the first runnable face of datagrep: `CoreApi` over a terminal."

[[bin]]
name = "datagrep"
path = "src/main.rs"

[dependencies]
datagrep-api = { path = "../datagrep-api" }
datagrep-core = { path = "../datagrep-core" }
datagrep-lang = { path = "../datagrep-lang" }
datagrep-profiles = { path = "../datagrep-profiles" }
datagrep-secrets = { path = "../datagrep-secrets" }
datagrep-drv-postgres = { path = "../datagrep-drv-postgres" }
datagrep-drv-sqlite = { path = "../datagrep-drv-sqlite" }

clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "sync",
    "fs",
    "io-std",
] }

# CoreApi hands tabular results back as Arrow `RecordBatch`es (datagrep-core's
# `WindowSlice::Table`); this crate has to read those cells to print them.
# Pinned to the same version datagrep-core uses so the `RecordBatch`/`ArrayRef`
# types are the exact same crate, not two incompatible major versions.
# Deviation from the ticket's dependency list, called out in the final
# report: not arrow-csv/arrow-json (this crate's NULL/Absent/empty-string
# distinction and streaming windows need custom formatting those crates
# don't provide), just the array/schema types already flowing through the
# seam.
arrow-array = "59.1"
arrow-schema = "59.1"

[dev-dependencies]
tempfile = "3"
# `SecretResolver::in_memory` for tests that exercise the keychain path without
# a real credential store — see the profiles tests.
datagrep-secrets = { path = "../datagrep-secrets", features = ["test-support"] }

[lints.clippy]
uninlined_format_args = "allow"
