[package]
name = "datagrep-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "C ABI over CoreApi: the seam a native Swift/AppKit macOS app links against — the desktop UI is just a CoreApi client."

[lib]
name = "datagrep_ffi"
# staticlib: what a Swift app links directly (one binary, no dylib to sign or
# ship). cdylib: what `swift run`/SwiftPM and a plugin host load at runtime.
# `rlib` is also emitted so this crate's own integration tests can link it.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
datagrep-api = { path = "../datagrep-api" }
datagrep-core = { path = "../datagrep-core" }
datagrep-lang = { path = "../datagrep-lang" }
datagrep-profiles = { path = "../datagrep-profiles" }
datagrep-secrets = { path = "../datagrep-secrets" }
datagrep-drv-postgres = { path = "../datagrep-drv-postgres" }
datagrep-drv-sqlite = { path = "../datagrep-drv-sqlite" }
datagrep-drv-redis = { path = "../datagrep-drv-redis" }
datagrep-drv-mongo = { path = "../datagrep-drv-mongo" }
datagrep-drv-mysql = { path = "../datagrep-drv-mysql" }
datagrep-drv-elasticsearch = { path = "../datagrep-drv-elasticsearch" }

# The one global runtime for the whole process. `rt-multi-thread` for the four
# workers, `sync` for the broadcast/watch channels CoreApi hands out.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
once_cell = "1"

# --- dependencies beyond the minimal set, each justified -----------------
# serde_json: every string this ABI returns is JSON by the header's own
# contract ("Returns JSON: [...]"). Not optional.
serde_json = { workspace = true }
# serde (derive): `datagrep_profiles_update`/`_add_json` take a typed JSON
# patch; hand-walking a serde_json::Value would re-implement Deserialize badly.
serde = { workspace = true }
# arrow-array/-schema: `datagrep_core::store::WindowSlice::Table` hands back an
# `Arc<RecordBatch>`. Reading a tabular cell at all means reading Arrow.
# Pinned to datagrep-core's exact versions so the `RecordBatch` flowing across the
# seam is the same crate, not two incompatible majors.
arrow-array = "59.1"
arrow-schema = "59.1"

[dev-dependencies]
# `SecretResolver::in_memory` — see DatagrepCore::with_store_in_memory_secrets.
datagrep-secrets = { path = "../datagrep-secrets", features = ["test-support"] }
tempfile = "3"

[lints.clippy]
uninlined_format_args = "allow"
# Every `extern "C"` entry point here takes raw pointers by contract.
missing_safety_doc = "allow"
# `guard`/`set_err` (ffi_util.rs) take `err_out: *mut *mut c_char` and are
# deliberately safe wrappers: `set_err` null-checks the pointer before ever
# writing through it, so every caller across this crate can stay unmarked
# `unsafe` at the call site — the one place that actually dereferences it
# already carries its own `# Safety` doc.
not_unsafe_ptr_arg_deref = "allow"
