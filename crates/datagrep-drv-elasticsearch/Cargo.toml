[package]
name = "datagrep-drv-elasticsearch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Elasticsearch / OpenSearch driver for datagrep: hand-rolled REST client (reqwest + serde_json) over the datagrep-api seam (design §3.1, §3.2, §3.3, §5.1)."

[dependencies]
datagrep-api = { path = "../datagrep-api" }

# The official `elasticsearch` crate is NOT used, deliberately: it has only
# ever published alpha releases (9.1.0-alpha.1 after ~6 years), and — fatally
# for design §3.2 — it buffers the entire JSON response body with no streaming
# API at all (its streaming-helper issue has been open since 2020). The
# `opensearch` crate is not a substitute either: OpenSearch forked at ES 7.10.2
# and its index format, security API and query syntax have diverged from ES
# 8/9. So the REST surface we actually need (`_search`, `_pit`, `_scroll`,
# `_tasks`, `_cat`, `_mapping`) is hand-rolled here on plain HTTP.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "stream",
] }
serde = { workspace = true }
serde_json = { workspace = true }

tokio = { version = "1", features = ["rt", "sync", "time"] }
futures-util = "0.3"

thiserror = { workspace = true }
tracing = "0.1"

# Required to implement datagrep-api's #[async_trait] traits (datagrep-api does
# not re-export the macro) and to build Value::Bytes/Unsupported without a
# separate transitive `bytes` version.
async-trait = { workspace = true }
bytes = { workspace = true }

# HTTP Basic / API-key auth headers (design §3.8: credentials are resolved
# late and never logged).
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
