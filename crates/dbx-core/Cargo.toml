[package]
name = "dbx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dbx orchestrator: sessions, streaming pipeline, result store, query lifecycle (design §3)"

[features]
# Exposes the mock driver/cursor for driver crates and the spike UI to reuse.
testing = []

[dependencies]
dbx-api = { path = "../dbx-api" }

# dbx-api declares its traits with #[async_trait]; implementing them (mocks,
# adapters) requires the same macro. Already a workspace dependency.
async-trait = { workspace = true }
# Value::Bytes and ResumeToken are bytes::Bytes; already a workspace dependency.
bytes = { workspace = true }
thiserror = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["time"] }
tracing = "0.1"

# Pinned here (not in the workspace manifest, which is owned by the orchestrator):
# latest stable arrow-rs, trimmed per design §5.1 — array/schema/buffer only,
# no parquet, no flight, no full compute kernels.
arrow-array = "59.1"
arrow-schema = "59.1"
arrow-buffer = "59.1"
# arrow-ipc: the spill format IS Arrow IPC (design §3.2 "append-only Arrow IPC
# per result set"); this is the writer/reader for it, not a compute kernel.
arrow-ipc = "59.1"

[dev-dependencies]
serde_json = { workspace = true }
