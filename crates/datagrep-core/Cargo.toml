[package]
name = "datagrep-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "datagrep orchestrator: sessions, streaming pipeline, result store, query lifecycle"

[features]
# Exposes the mock driver/cursor for driver crates and the spike UI to reuse.
testing = []

[dependencies]
datagrep-api = { path = "../datagrep-api" }

# datagrep-api declares its traits with #[async_trait]; implementing them (mocks,
# adapters) requires the same macro. Already a workspace dependency.
async-trait = { workspace = true }
# Value::Bytes and ResumeToken are bytes::Bytes; already a workspace dependency.
bytes = { workspace = true }
thiserror = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["time"] }
tracing = "0.1"

# Pinned here (not in the workspace manifest, which is owned by the orchestrator):
# latest stable arrow-rs, deliberately trimmed to array/schema/buffer only —
# no parquet, no flight, no full compute kernels. We store and slice columns;
# we do not evaluate expressions over them, and the unused crates would cost
# build time and binary size for nothing.
arrow-array = "59.1"
arrow-schema = "59.1"
arrow-buffer = "59.1"
# arrow-ipc: the spill format is an append-only Arrow IPC stream per result
# set; this is the writer/reader for it, not a compute kernel.
arrow-ipc = "59.1"

[dev-dependencies]
serde_json = { workspace = true }
