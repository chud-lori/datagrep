[package]
name = "datagrep-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Secret references and resolvers for datagrep: keychain | env | exec | prompt. Profiles never store secrets, only refs."

[features]
# Exposes `SecretResolver::in_memory`, which serves `keychain:` refs from a map
# instead of the OS credential store. Enabled by dev-dependencies only, so a
# release build cannot construct a resolver that bypasses the real keychain.
test-support = []

[dependencies]
datagrep-api = { path = "../datagrep-api" }
# keyring 3.x: platform stores are opt-in features. `sync-secret-service` is the
# blocking Secret Service client (DBus IPC) — we call it from spawn_blocking,
# once at pool creation, so an async worker never stalls on it.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
thiserror = { workspace = true }
# `time` is needed for the exec timeout; `rt` for spawn_blocking; `io-util`
# for `AsyncReadExt::read_to_end` on the child's stdout/stderr pipes; `macros`
# for `tokio::join!` (both used in `resolve_exec`). This crate's own tests
# passed without `io-util`/`macros` here only because building it alongside
# datagrep-tunnel in the same `cargo` invocation unified tokio's feature set
# across the workspace and papered over the gap — verified by building
# `-p datagrep-secrets` alone against a clean target dir, which failed until this
# was added.
tokio = { version = "1", features = ["process", "rt", "time", "io-util", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
