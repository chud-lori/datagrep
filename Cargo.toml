[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[workspace.dependencies]
# The full dependency set allowed in dbx-api (design doc §3, crate rules).
async-trait = "0.1"
bitflags = { version = "2", features = ["serde"] }
bytes = { version = "1", features = ["serde"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"

# Dev-only (tests). Never a runtime dependency of dbx-api.
serde_json = "1"

# Release profile per design doc §5.1 / §9.5 / §9.9.
# panic stays "unwind": driver-panic isolation (a poisoned connection is evicted,
# the app survives) and wgpu device-lost handling both depend on it.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
incremental = false
