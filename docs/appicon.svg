<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E6BE6"/>
      <stop offset="100%" stop-color="#1B3FA8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS-style rounded tile (squircle-ish radius) -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#tile)"/>
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#sheen)"/>

  <!-- data grid: three rows of cells, the middle one highlighted like a match -->
  <g filter="url(#soft)">
    <g fill="#ffffff">
      <rect x="236" y="330" width="250" height="66" rx="16" opacity="0.55"/>
      <rect x="512" y="330" width="150" height="66" rx="16" opacity="0.30"/>

      <!-- the "matched" row — grep found this one -->
      <rect x="236" y="436" width="426" height="66" rx="16" opacity="1"/>

      <rect x="236" y="542" width="180" height="66" rx="16" opacity="0.30"/>
      <rect x="442" y="542" width="220" height="66" rx="16" opacity="0.55"/>
    </g>

    <!-- magnifier: the grep -->
    <g transform="translate(556,470)">
      <circle cx="118" cy="118" r="132" fill="none" stroke="#ffffff" stroke-width="52"/>
      <circle cx="118" cy="118" r="132" fill="#1B3FA8" fill-opacity="0.35"/>
      <rect x="212" y="212" width="188" height="54" rx="27"
            transform="rotate(45 212 212)" fill="#ffffff"/>
    </g>
  </g>
</svg>
